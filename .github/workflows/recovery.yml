name: Building recovery

on:
  workflow_dispatch:

env:
  MANIFEST: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-14
  DEVICE: a26x
  DT_LINK: https://github.com/Rerence1016/twrp-device-samsung-a26x/
  DT_PATH: device/samsung/a26x
  TARGET: recoveryimage
  OUTPUT: recovery.tar

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
       - name: Checkout
         uses: actions/checkout@master
         

       - name: Initializing environment
         run: |
            docker rmi `docker images -q`
            
            git config --global user.name ""
            git config --global user.email ""

            sudo apt-get remove --purge -y aisleriot \
                                           brltty \
                                           duplicity \
                                           gnome-contacts \
                                           gnome-mahjongg \
                                           gnome-mines \
                                           gnome-orca \
                                           gnome-sudoku \
                                           gnome-video-effects \
                                           landscape-common \
                                           libreoffice-avmedia-backend-gstreamer \
                                           libreoffice-base-core \
                                           libreoffice-calc \
                                           libreoffice-common \
                                           libreoffice-core \
                                           libreoffice-draw \
                                           libreoffice-gnome \
                                           libreoffice-gtk \
                                           libreoffice-impress \
                                           libreoffice-math \
                                           libreoffice-ogltrans \
                                           libreoffice-pdfimport \
                                           libreoffice-style-galaxy \
                                           libreoffice-style-human \
                                           libreoffice-writer \
                                           libsane \
                                           libsane-common \
                                           python3-uno \
                                           rhythmbox \
                                           rhythmbox-plugins \
                                           sane-utils \
                                           shotwell \
                                           shotwell-common \
                                           totem \
                                           totem-common \
                                           totem-plugins \
                                           printer-driver-brlaser \
                                           printer-driver-foo2zjs \
                                           printer-driver-foo2zjs-common \
                                           printer-driver-m2300w \
                                           printer-driver-ptouch \
                                           printer-driver-splix \
                                           snapd \
                                           fwupd \
                                           thunderbird \
                                           remmina \
                                           cheese \
                                           transmission \
                                           simple-scan \
                                           gnome-initial-setup \

            sudo apt-get autoremove -y         
            
            sudo rm -rf /usr/share/dotnet
            sudo rm -rf /etc/mysql
            sudo rm -rf /etc/php
            sudo rm -rf /usr/share/dotnet
            sudo rm -rf /usr/local/lib/android
            sudo rm -rf /opt/ghc
            sudo rm -rf /opt/hostedtoolcache/CodeQL
            sudo rm -rf /opt/az
            sudo rm -rf /opt/ghc 
            sudo rm -rf "/usr/local/share/boost" 
            sudo rm -rf "$AGENT_TOOLSDIRECTORY"
            
            sudo -E apt-get clean
            df -h
            sudo -E apt-get -qq update
            sudo -E apt-get -qq install bc build-essential zip curl libstdc++6 git wget python3 gcc clang libssl-dev repo rsync flex curl  bison aria2
            sudo curl --create-dirs -L -o /usr/local/bin/repo -O -L https://storage.googleapis.com/git-repo-downloads/repo
            sudo chmod a+rx /usr/local/bin/repo

       - name: Sync recovery source and device tree
         run: |
             mkdir work
             cd work
             repo init -u $MANIFEST --depth=1
             repo sync -c -j4 --force-sync --no-clone-bundle --no-tags
             git clone $DT_LINK --depth=1 --single-branch $DT_PATH
             sudo chmod a+rx $DT_PATH/mkbootimg
             
             
       - name: Build
         run: |
              cd work
              . build/envsetup.sh &&lunch twrp_$DEVICE-eng &&export ALLOW_MISSING_DEPENDENCIES=true && mka $TARGET

       - name: Save
         uses: actions/upload-pages-artifact@v3
         with:
            name: twrp-recovery
            path: /home/runner/work/twrp-device-samsung-a26x/twrp-device-samsung-a26x/work/out/target/product/a26x/recovery.tar
            retention-days: 5
